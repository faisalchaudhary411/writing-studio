{% extends "base.html" %}

{% block title %}Urdu AI Writer{% endblock %}

{% block content %}
<section style="padding: 3rem 0 2rem">
  <div class="container">
    <div class="section-header">
      <h1 class="section-title">✍️ Urdu AI Writer</h1>
      <p class="section-subtitle">قدرتی پاکستانی اردو میں مواد — چند سیکنڈ میں۔</p>
      {% if is_pro %}
        <span class="stat-pill pro">⭐ Pro — Unlimited</span>
      {% else %}
        <span class="stat-pill">🆓 Free — <span id="actions-left">{{ actions_left }}</span> actions left today</span>
      {% endif %}
    </div>

    <div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Content Type</label>
          <select class="form-select" id="urdu-type">
            <option>YouTube Script (with hook & CTA)</option>
            <option>Blog Post / Article</option>
            <option>Facebook Caption</option>
            <option>Instagram Caption</option>
            <option>Twitter/X Thread</option>
            <option>Product Description</option>
            <option>WhatsApp Business Message</option>
            <option>Custom Content</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tone</label>
          <select class="form-select" id="urdu-tone">
            <option>Professional</option>
            <option>Friendly & Casual</option>
            <option>Formal</option>
            <option>Funny & Engaging</option>
            <option>Motivational</option>
            <option>Informational</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Language Style</label>
          <select class="form-select" id="urdu-lang">
            <option>Pure Urdu (اردو)</option>
            <option>Roman Urdu</option>
            <option>Mixed (Urdu + English)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Length</label>
          <select class="form-select" id="urdu-length">
            <option>Short (100-200 words)</option>
            <option selected>Medium (300-500 words)</option>
            <option>Long (600-1000 words)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Topic or Details</label>
        <textarea class="form-textarea" id="urdu-topic" rows="4" placeholder="مثال: صبح جلدی اٹھنے کے فوائد پاکستانی طلباء کے لیے..."></textarea>
      </div>

      <button class="btn btn-primary" id="generate-urdu-btn" style="width:100%">✍️ Generate Urdu Content</button>

      <div id="urdu-output" class="output-box urdu" style="display:none"></div>
      <button class="btn btn-secondary" id="download-urdu-btn" data-download="#urdu-output" data-filename="qalam_urdu_content.txt" style="width:100%;margin-top:0.75rem;display:none">📥 Download as TXT</button>
    </div>
  </div>
</section>

<script>
document.getElementById("generate-urdu-btn").addEventListener("click", function() {
  setTimeout(() => {
    document.getElementById("download-urdu-btn").style.display = "inline-flex";
  }, 1000);
});
</script>
{% endblock %}
