{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<section style="padding: 3rem 0 2rem">
  <div class="container" style="max-width: 800px">
    <a href="{{ url_for('blog') }}" class="btn btn-ghost btn-sm mb-2">← Back to Blog</a>
    <span class="blog-category" style="display:inline-block;margin-bottom:1rem;background:rgba(156,107,46,0.1);color:var(--accent);border:1px solid rgba(156,107,46,0.25);padding:0.2rem 0.6rem;border-radius:6px;font-size:0.7rem;font-weight:700;text-transform:uppercase">{{ post.category }}</span>
    <h1 style="font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,4vw,2.5rem);color:var(--text-primary);margin-bottom:0.5rem;line-height:1.2">{{ post.title }}</h1>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:2rem">{{ post.date }}</p>
    <div class="output-box ltr" style="white-space:pre-wrap;font-size:1rem;line-height:1.9">{{ post.body }}</div>
  </div>
</section>
{% endblock %}
